<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIS Generator – Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1EE;
    --panel:#FFFFFF;
    --ink:#1F2E29;
    --muted:#5C6B64;
    --primary:#2F5D57;
    --primary-soft:#DCE6E2;
    --ok:#4C7A64;
    --ok-soft:#E4EDE7;
    --warn:#BE6A3B;
    --warn-soft:#F3E4D9;
    --border:#D7DBD3;
    --flag:#8A4B2E;
    --flag-soft:#F6E8DE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3{font-family:'Source Serif 4', serif; font-weight:600; margin:0;}

  header.topbar{
    display:flex; flex-wrap:wrap; gap:16px; align-items:center;
    padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--border);
  }
  header.topbar h1{font-size:20px; color:var(--primary); margin-right:4px;}
  header.topbar .field, .patientbar .field{display:flex; flex-direction:column; gap:2px;}
  header.topbar label, .patientbar label{font-size:12px; color:var(--muted);}
  header.topbar input, .patientbar input, .patientbar select{
    font-family:inherit; font-size:14px; padding:6px 8px;
    border:1px solid var(--border); border-radius:4px; background:#FBFBF9;
  }
  header.topbar .spacer{flex:1;}
  .patientbar{
    padding:12px 24px 14px; background:var(--panel); border-bottom:1px solid var(--border);
  }
  .patientbar .group{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;}
  .patientbar .group + .group{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
  .patientbar .group-label{
    width:100%; font-size:11px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--muted); margin-bottom:-2px;
  }
  .patientbar .field{min-width:150px;}
  .patientbar .field.wide{flex:2; min-width:240px;}
  .btn{
    font-family:inherit; font-size:14px; padding:8px 14px; border-radius:4px;
    border:1px solid var(--primary); background:var(--primary); color:#fff;
    cursor:pointer;
  }
  .btn.secondary{background:#fff; color:var(--primary);}
  .btn.subtle{border-color:var(--border); background:#fff; color:var(--ink); font-size:13px; padding:6px 12px;}
  .btn:hover{opacity:0.9;}

  .tabs{
    display:flex; gap:0; background:var(--panel); border-bottom:1px solid var(--border);
    padding:0 24px; overflow-x:auto;
  }
  .tab-btn{
    font-family:inherit; font-size:14px; padding:12px 4px; margin-right:26px;
    background:none; border:none; border-bottom:2px solid transparent; color:var(--muted);
    cursor:pointer; white-space:nowrap;
  }
  .tab-btn.active{color:var(--primary); border-bottom-color:var(--primary); font-weight:600;}
  .tab-sub{display:block; font-size:11px; color:var(--muted); font-weight:400;}

  .layout{
    display:grid;
    grid-template-columns:260px 1fr 380px;
    min-height:calc(100vh - 116px);
  }
  .layout.single{grid-template-columns:1fr;}
  .layout.single nav.side, .layout.single aside.output{display:none;}
  @media (max-width:980px){
    .layout{grid-template-columns:1fr;}
  }

  nav.side{
    background:var(--panel); border-right:1px solid var(--border);
    padding:16px 0;
  }
  nav.side .progress-line{
    padding:0 20px 12px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--border); margin-bottom:8px;
  }
  .nav-item{
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 20px; cursor:pointer; border-left:3px solid transparent;
  }
  .nav-item:hover{background:#F5F7F4;}
  .nav-item.active{background:var(--primary-soft); border-left-color:var(--primary);}
  .nav-num{
    width:22px; height:22px; border-radius:50%; flex:none; margin-top:1px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; border:1px solid var(--border); color:var(--muted); background:#fff;
  }
  .nav-item.active .nav-num{border-color:var(--primary); color:var(--primary);}
  .nav-num.done{background:var(--ok); border-color:var(--ok); color:#fff;}
  .nav-num.partial{background:var(--ok-soft); border-color:var(--ok); color:var(--ok);}
  .nav-name{font-size:13.5px;}
  .nav-sub{display:block; font-size:11px; color:var(--muted); margin-top:2px;}

  main.center{padding:24px 28px; overflow-y:auto;}
  main.center h2{font-size:19px; margin-bottom:2px;}
  main.center .weight-tag{font-size:12.5px; color:var(--muted); margin-bottom:14px;}
  main.center .sub{color:var(--muted); font-size:13px; margin-bottom:16px;}
  .flag-box{
    background:var(--flag-soft); border:1px solid #E3C6AE; color:var(--flag);
    border-radius:4px; padding:10px 12px; font-size:12.5px; margin-bottom:18px;
  }
  .info-box{
    background:var(--primary-soft); border:1px solid #C4D3CD; color:var(--primary);
    border-radius:4px; padding:12px 14px; font-size:13px; margin-bottom:18px;
  }

  .question-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    padding:14px 0; border-bottom:1px solid var(--border);
  }
  .question-row .qtext{margin:0; max-width:58ch;}
  .question-row .qnum{color:var(--muted); font-size:12.5px; margin-right:6px;}
  .question-row .qcrit{font-weight:600; display:block; margin-bottom:2px; font-size:14px;}
  .question-row .qexpl{margin:0; color:var(--ink);}
  .toggle{display:flex; border:1px solid var(--border); border-radius:4px; overflow:hidden; flex:none;}
  .toggle button{
    font-family:inherit; font-size:13px; padding:7px 16px; border:none; background:#fff; color:var(--muted);
    cursor:pointer; border-right:1px solid var(--border);
  }
  .toggle button:last-child{border-right:none;}
  .toggle button.on-ja.selected{background:var(--ok-soft); color:var(--ok); font-weight:600;}
  .toggle button.on-nein.selected{background:var(--warn-soft); color:var(--warn); font-weight:600;}

  .source-group{margin-bottom:18px;}
  .source-group h4{font-size:13px; color:var(--muted); font-weight:600; margin-bottom:6px;}
  .source-item{
    display:flex; justify-content:space-between; gap:10px; align-items:center;
    padding:6px 0; font-size:13px; border-bottom:1px dashed var(--border);
  }
  .status-chip{font-size:11.5px; padding:2px 8px; border-radius:10px; flex:none;}
  .status-chip.ja{background:var(--ok-soft); color:var(--ok);}
  .status-chip.nein{background:var(--warn-soft); color:var(--warn);}
  .status-chip.leer{background:#EEE; color:var(--muted);}

  .risk-present{color:#B23B3B; font-weight:700;}
  .risk-absent{color:var(--ok); font-weight:700;}
  .toggle.risk-toggle button.on-ja.selected{background:#F6DEDE; color:#B23B3B; font-weight:600;}
  .toggle.risk-toggle button.on-nein.selected{background:var(--ok-soft); color:var(--ok); font-weight:600;}

  aside.output{
    background:var(--panel); border-left:1px solid var(--border);
    padding:20px 22px; overflow-y:auto;
  }
  aside.output h3{font-size:15px; margin-bottom:2px;}
  aside.output .sub{color:var(--muted); font-size:12.5px; margin-bottom:12px;}
  aside.output textarea{
    width:100%; min-height:300px; font-family:inherit; font-size:13.5px; line-height:1.55;
    padding:12px; border:1px solid var(--border); border-radius:4px; resize:vertical; background:#FBFBF9;
  }
  aside.output .out-actions{display:flex; gap:8px; margin-top:10px;}
  aside.output .note{font-size:12px; color:var(--muted); margin-top:14px; border-top:1px solid var(--border); padding-top:12px;}

  /* Diagnose-Formular */
  .form-card{background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:18px 20px; max-width:720px; margin-bottom:20px;}
  .form-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .form-field{display:flex; flex-direction:column; gap:4px; flex:1; min-width:150px;}
  .form-field label{font-size:12px; color:var(--muted);}
  .form-field input{
    font-family:inherit; font-size:14px; padding:8px 10px;
    border:1px solid var(--border); border-radius:4px; background:#FBFBF9;
  }
  .list-wrap{max-width:720px;}
  .list-card{
    border:1px solid var(--border); border-radius:4px; padding:12px 14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:flex-start; background:var(--panel);
  }
  .list-card .title{font-weight:600; font-size:14px;}
  .list-card .meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .remove-btn{background:none; border:none; color:var(--warn); cursor:pointer; font-size:13px; flex:none;}
  .empty-hint{color:var(--muted); font-size:13px; max-width:720px;}

  /* SIS lesen – Dokumentenblatt */
  .doc-sheet{max-width:760px; margin:0 auto; background:var(--panel); border:1px solid var(--border); padding:36px 44px;}
  .doc-sheet h2{font-size:22px; margin-bottom:4px;}
  .doc-sheet .doc-meta{color:var(--muted); font-size:13px; margin-bottom:24px; border-bottom:1px solid var(--border); padding-bottom:16px;}
  .doc-sheet h3{font-size:15px; color:var(--primary); margin:22px 0 8px;}
  .doc-sheet table{width:100%; border-collapse:collapse; font-size:13.5px; margin-bottom:6px;}
  .doc-sheet td, .doc-sheet th{padding:6px 8px; border-bottom:1px solid var(--border); text-align:left;}
  .doc-sheet ul{margin:0; padding-left:18px; font-size:13.5px;}
  .doc-sheet p.field-text{margin:0 0 4px; font-size:13.5px;}
  .doc-actions{max-width:760px; margin:0 auto 18px; display:flex; gap:10px;}
</style>
</head>
<body>

<header class="topbar">
  <h1>SIS Generator</h1>
  <div class="spacer"></div>
  <span id="progressGlobal" style="font-size:13px;color:var(--muted);"></span>
</header>

<div class="patientbar" id="patientBar">
  <div class="group">
    <span class="group-label">Person</span>
    <div class="field"><label for="pvorname">Vorname (mit Abkürzung)</label><input id="pvorname" type="text" placeholder="z. B. Fr. Sch."></div>
  </div>
  <div class="group">
    <span class="group-label">Pflege &amp; Kontakte</span>
    <div class="field"><label for="pdate">Datum der Aufnahme</label><input id="pdate" type="date"></div>
    <div class="field"><label for="ppflegegrad">Pflegegrad</label>
      <select id="ppflegegrad">
        <option value="">noch nicht beantragt</option>
        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        <option value="4">4</option><option value="5">5</option>
      </select>
    </div>
  </div>
</div>

<div class="tabs" id="tabsWrap"></div>

<div class="layout" id="layoutWrap">
  <nav class="side" id="sideNav"></nav>
  <main class="center" id="centerArea"></main>
  <aside class="output" id="outputArea"></aside>
</div>

<script>
// Kriterien basieren auf dem Begutachtungsinstrument (NBA) der Pflegeversicherung
// (§ 14/§ 15 SGB XI, Begutachtungsrichtlinie GKV-Spitzenverband). Fragen frei umformuliert.
const NBA_MODULES = [
  { id:'mobilitaet', num:1, name:'Mobilität', weight:'10 %', questions:[
    {id:'1.1', crit:'Positionswechsel im Bett', text:'Kann die Person die Position im Bett selbstständig wechseln (drehen, aufsetzen)?',
      ja:['Der Positionswechsel im Bett, etwa das Drehen um die eigene Achse und das Aufrichten aus der liegenden Position, gelingt vollständig eigenständig.', 'Positionswechsel im Bett, einschließlich Drehen und Aufrichten, werden ohne fremde Hilfe bewältigt.'], nein:['Der Positionswechsel im Bett kann nicht ohne personelle Unterstützung bewältigt werden, sodass hierbei ein regelmäßiger Hilfebedarf besteht.', 'Beim Positionswechsel im Bett, etwa dem Drehen oder Aufrichten, ist die Person durchgehend auf personelle Hilfe angewiesen.']},
    {id:'1.2', crit:'Halten einer stabilen Sitzposition', text:'Kann eine stabile Sitzposition auf Bett, Stuhl oder Sessel gehalten werden, ohne das Gleichgewicht zu verlieren?',
      ja:['Eine stabile Sitzposition auf Bett, Stuhl oder Sessel wird sicher und ohne fremde Hilfe eingenommen und gehalten.', 'Das Sitzen auf Bett, Stuhl oder Sessel gelingt mit stabiler Rumpfkontrolle und ohne Unterstützung.'], nein:['Das Halten einer stabilen Sitzposition gelingt aufgrund mangelnder Rumpfkontrolle nicht eigenständig, weshalb eine entsprechende Unterstützung erforderlich ist.', 'Aufgrund unzureichender Rumpfkontrolle kann eine stabile Sitzposition nicht ohne Hilfestellung gehalten werden.']},
    {id:'1.3', crit:'Umsetzen', text:'Kann die Person von einer erhöhten Sitzfläche aufstehen und sich selbstständig umsetzen (z. B. in den Rollstuhl)?',
      ja:['Das Umsetzen von einer erhöhten Sitzfläche, beispielsweise vom Bett in den Rollstuhl, wird selbstständig und sicher durchgeführt.', 'Das Umsetzen, etwa vom Bett in den Rollstuhl, gelingt sicher und in Eigenregie.'], nein:['Beim Umsetzen, etwa vom Bett in den Rollstuhl, besteht ein Unterstützungsbedarf, da die erforderliche Kraft und Stabilität nicht ausreichend vorhanden sind.', 'Wegen unzureichender Kraft und Standsicherheit kann das Umsetzen, etwa vom Bett in den Rollstuhl, nicht selbstständig erfolgen.']},
    {id:'1.4', crit:'Fortbewegen innerhalb des Wohnbereichs', text:'Kann sich die Person sicher innerhalb der Wohnung bzw. des Wohnbereichs fortbewegen (ca. 8 m)?',
      ja:['Die Fortbewegung innerhalb des Wohnbereichs erfolgt sicher und selbstständig, auch über längere Strecken.', 'Innerhalb des Wohnbereichs bewegt sich die Person sicher und ohne fremde Unterstützung fort.'], nein:['Die Fortbewegung innerhalb des Wohnbereichs ist eingeschränkt und erfordert die Begleitung bzw. Unterstützung durch das Pflegepersonal.', 'Die Person ist bei der Fortbewegung innerhalb des Wohnbereichs auf Begleitung durch das Pflegepersonal angewiesen.']},
    {id:'1.5', crit:'Treppensteigen', text:'Kann die Person eine Treppe zwischen zwei Etagen hinauf- und hinabsteigen?',
      ja:['Treppen zwischen zwei Etagen können eigenständig und ohne fremde Hilfe bewältigt werden.', 'Das Treppensteigen zwischen zwei Etagen gelingt sicher und in Eigenregie.'], nein:['Das Treppensteigen ist ohne personelle Unterstützung nicht möglich und stellt somit eine relevante Einschränkung der Mobilität dar.', 'Treppen können nur mit personeller Unterstützung bewältigt werden, was die Mobilität deutlich einschränkt.']},
  ]},
  { id:'kognition', num:2, name:'Kognitive und kommunikative Fähigkeiten', weight:'15 % (mit Modul 3 kombiniert)', questions:[
    {id:'2.1', crit:'Erkennen von Personen aus dem näheren Umfeld', text:'Werden vertraute Personen (Angehörige, Pflegepersonal) wiedererkannt?',
      ja:['Vertraute Personen aus dem näheren Umfeld, etwa Angehörige und Pflegepersonal, werden zuverlässig wiedererkannt.', 'Angehörige sowie vertraute Pflegepersonen werden zuverlässig erkannt.'], nein:['Vertraute Personen aus dem näheren Umfeld werden nicht durchgehend sicher wiedererkannt, was auf eine kognitive Beeinträchtigung hindeutet.', 'Das Wiedererkennen vertrauter Personen gelingt nicht durchgängig, was für eine kognitive Einschränkung spricht.']},
    {id:'2.2', crit:'Örtliche Orientierung', text:'Findet sich die Person in der eigenen Wohnung bzw. vertrauten Umgebung zurecht?',
      ja:['Die örtliche Orientierung innerhalb der vertrauten Umgebung ist vollständig erhalten.', 'In der vertrauten Umgebung findet sich die Person zuverlässig zurecht.'], nein:['Die örtliche Orientierung ist deutlich beeinträchtigt, sodass sich die Person auch in vertrauter Umgebung nicht zuverlässig zurechtfindet.', 'Auch in vertrauter Umgebung zeigen sich deutliche Orientierungsschwierigkeiten.']},
    {id:'2.3', crit:'Zeitliche Orientierung', text:'Kann die Person Tageszeit, Wochentag und Jahreszeit richtig einordnen?',
      ja:['Tageszeit, Wochentag und Jahreszeit werden zuverlässig richtig eingeordnet, die zeitliche Orientierung ist somit gegeben.', 'Die zeitliche Orientierung ist erhalten, Tageszeit, Wochentag und Jahreszeit werden korrekt benannt.'], nein:['Die zeitliche Orientierung ist eingeschränkt, Tageszeit, Wochentag und Jahreszeit werden nicht durchgehend korrekt erfasst.', 'Tageszeit, Wochentag und Jahreszeit können nicht zuverlässig benannt werden, die zeitliche Orientierung ist beeinträchtigt.']},
    {id:'2.4', crit:'Erinnern an wesentliche Ereignisse und Beobachtungen', text:'Kann sich die Person an kürzlich Erlebtes oder Mitgeteiltes erinnern?',
      ja:['Kürzlich Erlebtes sowie Mitgeteiltes wird zuverlässig erinnert, das Kurzzeitgedächtnis erscheint intakt.', 'Das Kurzzeitgedächtnis erscheint intakt, kürzlich Erlebtes wird zuverlässig wiedergegeben.'], nein:['Das Erinnern an kürzlich Erlebtes oder Mitgeteiltes gelingt nur eingeschränkt, was auf eine Beeinträchtigung des Kurzzeitgedächtnisses hinweist.', 'Es zeigen sich Einschränkungen des Kurzzeitgedächtnisses, kürzlich Erlebtes wird nur unvollständig erinnert.']},
    {id:'2.5', crit:'Steuern von mehrschrittigen Alltagshandlungen', text:'Können Handlungsabläufe mit mehreren Teilschritten selbstständig geplant und durchgeführt werden?',
      ja:['Handlungsabläufe mit mehreren Teilschritten werden selbstständig geplant und in der richtigen Reihenfolge durchgeführt.', 'Mehrschrittige Alltagshandlungen werden eigenständig und in korrekter Reihenfolge umgesetzt.'], nein:['Mehrschrittige Alltagshandlungen können nicht mehr eigenständig geplant und durchgeführt werden, sodass hierbei Anleitung und Unterstützung notwendig sind.', 'Bei der Planung und Durchführung mehrschrittiger Handlungsabläufe ist die Person auf Anleitung angewiesen.']},
    {id:'2.6', crit:'Treffen von Entscheidungen im Alltag', text:'Können alltägliche Entscheidungen (z. B. Kleidungswahl) eigenständig getroffen werden?',
      ja:['Alltägliche Entscheidungen, etwa die Wahl der Kleidung, werden eigenständig und situationsangemessen getroffen.', 'Entscheidungen des Alltags, etwa bei der Kleiderwahl, trifft die Person selbstständig und situationsgerecht.'], nein:['Bei alltäglichen Entscheidungen besteht Unterstützungsbedarf, da eine eigenständige und situationsangemessene Entscheidungsfindung nicht durchgehend gelingt.', 'Alltägliche Entscheidungen können nicht durchgehend eigenständig getroffen werden, eine Unterstützung ist erforderlich.']},
    {id:'2.7', crit:'Verstehen von Sachverhalten und Informationen', text:'Werden mitgeteilte Informationen inhaltlich erfasst?',
      ja:['Mitgeteilte Sachverhalte und Informationen werden inhaltlich zuverlässig erfasst und eingeordnet.', 'Informationen und Sachverhalte werden inhaltlich sicher verstanden und richtig eingeordnet.'], nein:['Mitgeteilte Informationen werden nicht durchgehend inhaltlich erfasst, sodass wiederholte oder vereinfachte Erklärungen erforderlich sind.', 'Das inhaltliche Verständnis mitgeteilter Informationen ist eingeschränkt, wiederholte Erklärungen sind notwendig.']},
    {id:'2.8', crit:'Erkennen von Risiken und Gefahren', text:'Werden Gefahrenquellen im Alltag (z. B. Herd, Verkehr) erkannt und richtig eingeschätzt?',
      ja:['Gefahrenquellen im Alltag, etwa am Herd oder im Straßenverkehr, werden zuverlässig erkannt und richtig eingeschätzt.', 'Alltägliche Gefahrenquellen, etwa Herd oder Straßenverkehr, werden sicher erkannt und angemessen eingeschätzt.'], nein:['Gefahrenquellen im Alltag werden nicht sicher erkannt bzw. in ihrer Tragweite nicht richtig eingeschätzt, woraus sich ein erhöhtes Risiko ergibt.', 'Die Einschätzung alltäglicher Gefahrenquellen gelingt nicht zuverlässig, woraus sich ein erhöhtes Risiko ergibt.']},
    {id:'2.9', crit:'Mitteilen von elementaren Bedürfnissen', text:'Können Grundbedürfnisse (Hunger, Schmerz, Toilette) verständlich geäußert werden?',
      ja:['Grundbedürfnisse wie Hunger, Schmerz oder Toilettengang werden klar und verständlich geäußert.', 'Grundbedürfnisse, etwa Hunger, Schmerz oder Toilettengang, werden verständlich mitgeteilt.'], nein:['Grundbedürfnisse können nicht immer verständlich geäußert werden, weshalb das Pflegepersonal auf aufmerksame Beobachtung angewiesen ist.', 'Die verständliche Äußerung von Grundbedürfnissen gelingt nicht durchgehend, eine aufmerksame Beobachtung durch das Personal ist erforderlich.']},
    {id:'2.10', crit:'Verstehen von Aufforderungen', text:'Werden einfache Aufforderungen verstanden und befolgt?',
      ja:['Einfache Aufforderungen werden zuverlässig verstanden und in der Regel unmittelbar befolgt.', 'Einfache Aufforderungen werden sicher verstanden und zeitnah umgesetzt.'], nein:['Einfache Aufforderungen werden nicht durchgehend verstanden bzw. umgesetzt, sodass eine wiederholte oder vereinfachte Ansprache notwendig ist.', 'Das Verstehen einfacher Aufforderungen gelingt nicht zuverlässig, eine vereinfachte Ansprache ist notwendig.']},
    {id:'2.11', crit:'Beteiligen an einem Gespräch', text:'Kann sich die Person aktiv an einem Gespräch beteiligen?',
      ja:['Eine aktive Beteiligung an Gesprächen ist möglich, die Person bringt sich situationsangemessen ein.', 'An Gesprächen kann sich die Person aktiv und situationsgerecht beteiligen.'], nein:['Eine aktive Beteiligung an Gesprächen ist nur eingeschränkt bzw. nicht möglich.', 'Die aktive Teilnahme an Gesprächen gelingt nur eingeschränkt.']},
  ]},
  { id:'verhalten', num:3, name:'Verhaltensweisen und psychische Problemlagen', weight:'15 % (mit Modul 2 kombiniert)', questions:[
    {id:'3.1', crit:'Motorisch geprägte Verhaltensauffälligkeiten', text:'Zeigt die Person motorisch geprägte Verhaltensauffälligkeiten (z. B. zielloses Umhergehen, Nesteln, Bewegungsunruhe)?',
      ja:['Es zeigen sich motorisch geprägte Verhaltensauffälligkeiten, etwa zielloses Umhergehen, Nesteln oder ausgeprägte Bewegungsunruhe.', 'Motorisch geprägte Auffälligkeiten wie zielloses Umhergehen oder Nesteln treten wiederkehrend auf.'], nein:['Motorisch geprägte Verhaltensauffälligkeiten sind zum aktuellen Zeitpunkt nicht zu beobachten.', 'Zum aktuellen Zeitpunkt zeigen sich keine motorisch geprägten Verhaltensauffälligkeiten.']},

// Flache Nachschlagetabelle: Kriterium-ID -> Frage-Objekt (inkl. Herkunfts-Modul)
const CRITERIA = {};
NBA_MODULES.forEach(mod=>{
  mod.questions.forEach(q=>{ CRITERIA[q.id] = Object.assign({}, q, {moduleId:mod.id, moduleName:mod.name}); });
});

let idCounter = 1;
function nextId(prefix){ return prefix + (idCounter++); }

const state = {
  view: 'begutachtung',
  currentModule: NBA_MODULES[0].id,
  currentField: SIS_FIELDS[0].id,
  answers: {},        // criterionId -> 'ja' | 'nein'

  meta: { ersteller:'', erstelltAm:'' }, // Nachweis, wer und wann die SIS erstellt hat

function totalQuestions(){ return NBA_MODULES.reduce((n,m)=>n+m.questions.length,0); }
function answeredInModule(mod){ return mod.questions.filter(q=>state.answers[q.id]).length; }
function answeredInField(field){ return field.source.filter(cid=>state.answers[cid]).length; }

// Verbindet Sätze mit passenden Konnektoren statt reiner Aneinanderreihung,
// je nachdem ob der nächste Satz in dieselbe Richtung weist (Ja→Ja / Nein→Nein)
// oder einen Kontrast bildet (Ja→Nein / Nein→Ja). Jeder Satz bleibt grammatisch
// vollständig und unverändert; der Konnektor wird als eigener Einleitungssatzteil vorangestellt.
const SAME_CONNECTORS = ['Ergänzend ist festzuhalten:', 'Hinzu kommt:', 'Darüber hinaus zeigt sich:', 'Des Weiteren ist zu beobachten:'];
const CONTRAST_CONNECTORS = ['Im Unterschied dazu gilt:', 'Demgegenüber zeigt sich:', 'Einschränkend ist zu beachten:', 'Abweichend davon gilt:'];

// Jedes Kriterium und jedes Risiko hat mehrere Formulierungsvarianten (unterschiedliches Register).
// Welche Variante gewählt wird, hängt deterministisch von der Person ab (Name + Geburtsdatum),
// damit zwei unterschiedliche Personen mit demselben Befund nicht denselben SIS-Text erhalten,
// der Text für dieselbe Person aber beim erneuten Öffnen stabil bleibt.
function patientSeedString(){
  const get = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  return get('pvorname') + '|' + get('pdate') + '|' + get('ppflegegrad');
}
function hashString(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}
function seededPick(salt, n){
  if(n<=1) return 0;
  return hashString(patientSeedString() + '::' + salt) % n;
}
function pickVariant(variants, salt){
  const arr = Array.isArray(variants) ? variants : [variants];
  return arr[seededPick(salt, arr.length)];
}

function joinSentencesWithConnectors(items){
  if(items.length===0) return '';
  const sOffset = seededPick('connector-same', SAME_CONNECTORS.length);
  const cOffset = seededPick('connector-contrast', CONTRAST_CONNECTORS.length);
  let sIdx=0, cIdx=0;
  let out = items[0].text;
  for(let i=1;i<items.length;i++){
    const sameType = items[i].type === items[i-1].type;
    const connector = sameType
      ? SAME_CONNECTORS[(sOffset + sIdx) % SAME_CONNECTORS.length]
      : CONTRAST_CONNECTORS[(cOffset + cIdx) % CONTRAST_CONNECTORS.length];
    if(sameType) sIdx++; else cIdx++;
    out += ' ' + connector + ' ' + items[i].text;
  }
  return out;
}
function computeFieldCriteriaText(field){
  const items = field.source
    .filter(cid=>state.answers[cid])
    .map(cid=>{
      const ans = state.answers[cid];
      const variants = ans==='ja' ? CRITERIA[cid].ja : CRITERIA[cid].nein;
      return { text: pickVariant(variants, cid+'::'+ans), type: ans };
    });
  return joinSentencesWithConnectors(items);
}
function computeFieldText(field){
  const narrative = computeFieldCriteriaText(field);
  const riskSentences = RISKS
    .filter(r=>r.fieldId===field.id)
    .filter(r=>effectiveRiskAnswer(r)==='ja')
    .map(r=>{
      const reasons = matchedReasons(r);
      return pickVariant(r.statement, r.id+'::ja') + (reasons.length ? ' Grund: ' + reasons.join(', ') + '.' : '');
    });
  const riskText = riskSentences.length ? 'Hinsichtlich der Risikoeinschätzung ist zudem Folgendes festzuhalten: ' + riskSentences.join(' ') : '';
  return [narrative, riskText].filter(Boolean).join(' ');
}
function fieldForCriterion(cid){ return SIS_FIELDS.find(f=>f.source.includes(cid)); }

// Risiko-Erkennung: automatisch aus den Begutachtungs-Antworten abgeleitet,
// sofern das Risiko nicht manuell im Tab "SIS" bestätigt/verneint wurde.
function matchedReasons(risk){
  return risk.triggers.filter(t=>state.answers[t.c]===t.when).map(t=>t.reason);
}
function effectiveRiskAnswer(risk){
  if(state.risks[risk.id]==='ja' || state.risks[risk.id]==='nein') return state.risks[risk.id];
  return matchedReasons(risk).length ? 'ja' : null;
}
function isAutoDetected(risk){
  return state.risks[risk.id]!=='ja' && state.risks[risk.id]!=='nein' && matchedReasons(risk).length>0;
}

function renderTabs(){
  const wrap = document.getElementById('tabsWrap');
  wrap.innerHTML = TAB_DEFS.map(t=>`
    <button class="tab-btn ${t.id===state.view?'active':''}" data-view="${t.id}">
      ${t.label}<span class="tab-sub">${t.sub}</span>
    </button>`).join('');
  wrap.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> setView(btn.dataset.view));
  });
}

function setView(v){
  state.view = v;
  const layout = document.getElementById('layoutWrap');
  layout.classList.toggle('single', v==='diagnose' || v==='massnahmen' || v==='lesen');
  renderTabs();
  renderAll();
}

function renderSideNav(){
  const nav = document.getElementById('sideNav');
  const answeredTotal = NBA_MODULES.reduce((n,m)=>n+answeredInModule(m),0);
  let html = '';
  if(state.view==='begutachtung'){
    html += `<div class="progress-line">${answeredTotal} von ${totalQuestions()} Kriterien beantwortet</div>`;
    NBA_MODULES.forEach(mod=>{
      const done = answeredInModule(mod);
      const cls = done===mod.questions.length ? 'done' : (done>0 ? 'partial' : '');
      html += `
        <div class="nav-item ${mod.id===state.currentModule?'active':''}" data-mod="${mod.id}">
          <span class="nav-num ${cls}">${mod.num}</span>
          <span>
            <span class="nav-name">${mod.name}</span>
            <span class="nav-sub">Gewichtung: ${mod.weight}</span>
          </span>
        </div>`;
    });
  } else if(state.view==='sis'){
    html += `<div class="progress-line">Erzeugt aus den ${answeredTotal} beantworteten NBA-Kriterien</div>`;
    SIS_FIELDS.forEach(field=>{
      const isFree = !!field.isFreitext;
      const done = answeredInField(field);
      const cls = isFree ? (state.overrides[field.id] ? 'done' : '') : (done===field.source.length ? 'done' : (done>0 ? 'partial' : ''));
      const numLabel = isFree ? '✎' : field.num;
      const subLabel = isFree ? 'Freitext' : `${done}/${field.source.length} Kriterien erfasst`;
      html += `
        <div class="nav-item ${field.id===state.currentField?'active':''}" data-field="${field.id}">
          <span class="nav-num ${cls}">${numLabel}</span>
          <span>
            <span class="nav-name">${field.name}</span>
            <span class="nav-sub">${subLabel}</span>
          </span>
        </div>`;
    });
  }
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(state.view==='begutachtung'){ state.currentModule = el.dataset.mod; }
      else{ state.currentField = el.dataset.field; }
      renderAll();
    });
  });
  document.getElementById('progressGlobal').textContent = `${answeredTotal} / ${totalQuestions()} NBA-Kriterien`;
}

function renderBegutachtungCenter(){
  const mod = NBA_MODULES.find(m=>m.id===state.currentModule);
  const area = document.getElementById('centerArea');
  let html = `<h2>${mod.num}. ${mod.name}</h2><div class="weight-tag">Gewichtung in der Gesamtpunktzahl: ${mod.weight}</div>`;
  if(MODULE_FLAGS[mod.id]){ html += `<div class="flag-box">${MODULE_FLAGS[mod.id]}</div>`; }
  html += `<div class="sub">Für jedes Kriterium Ja oder Nein wählen. Diese Rohdaten speisen später die SIS (eigener Tab).</div>`;
  mod.questions.forEach(q=>{
    const ans = state.answers[q.id];
    html += `
      <div class="question-row">
        <div class="qtext">
          <span class="qcrit"><span class="qnum">${q.id}</span>${q.crit}</span>
          <p class="qexpl">${q.text}</p>
        </div>
        <div class="toggle" data-q="${q.id}">
          <button class="on-ja ${ans==='ja'?'selected':''}" data-val="ja">Ja</button>
          <button class="on-nein ${ans==='nein'?'selected':''}" data-val="nein">Nein</button>
        </div>
      </div>`;
  });
  area.innerHTML = html;
  area.querySelectorAll('.toggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const qid = btn.parentElement.dataset.q;
      const val = btn.dataset.val;
      state.answers[qid] = (state.answers[qid]===val) ? null : val;
      const field = fieldForCriterion(qid);
      if(field) delete state.overrides[field.id];
      renderAll();
    });
  });
}

function renderBegutachtungOutput(){
  const answeredTotal = NBA_MODULES.reduce((n,m)=>n+answeredInModule(m),0);
  const out = document.getElementById('outputArea');
  out.innerHTML = `
    <h3>Begutachtung → SIS</h3>
    <div class="sub">Diese Ansicht sammelt nur die Rohdaten des Begutachtungsinstruments.</div>
    <div class="info-box">${answeredTotal} von ${totalQuestions()} Kriterien sind erfasst. Diagnose und der eigentliche SIS-Text werden in den nächsten Tabs erstellt – nicht hier.</div>
    <button class="btn" id="gotoNextBtn">Weiter zu Diagnose</button>
  `;
  document.getElementById('gotoNextBtn').addEventListener('click', ()=> setView('diagnose'));
}

// --- Diagnose ---
function renderDiagnoseView(){
  const area = document.getElementById('centerArea');
  area.innerHTML = `
    <h2>Diagnose</h2>
    <div class="sub">Aktuelle Diagnosen der Person erfassen. Diese erscheinen später im Dokument „SIS lesen".</div>
    <div class="form-card">
      <div class="form-row">
        <div class="form-field"><label for="diagText">Diagnose</label><input id="diagText" type="text" placeholder="z. B. Diabetes mellitus Typ 2"></div>
        <div class="form-field" style="flex:0 0 160px;"><label for="diagIcd">ICD-10 (optional)</label><input id="diagIcd" type="text" placeholder="z. B. E11.9"></div>
        <div class="form-field" style="flex:0 0 170px; flex-direction:row; align-items:center; gap:6px;">
          <input id="diagWichtig" type="checkbox" style="width:auto;">
          <label for="diagWichtig" style="margin:0;">Wichtige Diagnose</label>
        </div>
        <button class="btn" id="addDiagBtn">Hinzufügen</button>
      </div>
    </div>
    <div class="list-wrap" id="diagList"></div>
  `;
  document.getElementById('addDiagBtn').addEventListener('click', ()=>{
    const text = document.getElementById('diagText').value.trim();
    const icd = document.getElementById('diagIcd').value.trim();
    const wichtig = document.getElementById('diagWichtig').checked;
    if(!text) return;
    state.diagnoses.push({id:nextId('d'), text, icd, wichtig});
    renderDiagnoseView();
  });
  renderDiagnoseList();
}
function renderDiagnoseList(){
  const wrap = document.getElementById('diagList');
  if(state.diagnoses.length===0){ wrap.innerHTML = `<p class="empty-hint">Noch keine Diagnosen erfasst.</p>`; return; }
  const sorted = [...state.diagnoses].sort((a,b)=>(b.wichtig?1:0)-(a.wichtig?1:0));
  wrap.innerHTML = sorted.map(d=>`
    <div class="list-card">
      <div>
        <div class="title">${d.text}${d.wichtig?' <span class="status-chip ja">Wichtige Diagnose</span>':''}</div>
        ${d.icd?`<div class="meta">ICD-10: ${d.icd}</div>`:''}
      </div>
      <button class="remove-btn" data-id="${d.id}">Entfernen</button>
    </div>`).join('');
  wrap.querySelectorAll('.remove-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.diagnoses = state.diagnoses.filter(d=>d.id!==btn.dataset.id);
      renderDiagnoseList();
    });
  });
}

// --- Maßnahmenplan (automatisch aus Risikoeinschätzung) ---
function activeRisks(){ return RISKS.filter(r=>effectiveRiskAnswer(r)==='ja'); }

function renderMassnahmenView(){
  const area = document.getElementById('centerArea');
  const risks = activeRisks();

  let html = `<h2>Maßnahmenplan</h2>
    <div class="sub">Wird automatisch erzeugt, sobald ein Risiko im Begutachtungsinstrument erkannt oder im Tab „SIS" bestätigt wird. Einzelne Maßnahmen können entfernt oder ergänzt werden.</div>`;

  if(risks.length===0){
    html += `<p class="empty-hint">Noch kein Risiko erkannt bzw. bestätigt. Sobald im Tab „Begutachtungsinstrument" entsprechende Kriterien beantwortet oder im Tab „SIS" ein Risiko manuell bejaht wird, erscheinen hier automatisch passende Maßnahmen.</p>`;
  } else {
    risks.forEach(r=>{
      const auto = isAutoDetected(r);
      const reasons = matchedReasons(r);
      html += `<div class="form-card" style="max-width:100%;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <h3 style="font-size:15px; color:var(--primary); margin:0;">${r.label}${auto ? ' <span class="status-chip ja" style="margin-left:6px;">automatisch erkannt</span>' : ' <span class="status-chip leer" style="margin-left:6px;">manuell bestätigt</span>'}</h3>
          <button class="remove-btn" data-reset-risk="${r.id}">Entfernte Maßnahmen zurückholen</button>
        </div>`;
      if(reasons.length){
        html += `<div class="meta" style="margin-bottom:10px;">Grund: ${reasons.join(', ')}</div>`;
      }
      r.measures.forEach((m,i)=>{
        const key = r.id+'::'+i;
        if(state.excludedMeasures[key]) return;
        html += `<div class="source-item"><span>${m}</span><button class="remove-btn" data-remove-measure="${key}">Entfernen</button></div>`;
      });
      html += `</div>`;
    });
  }

  html += `<div class="form-card" style="max-width:100%;">
      <h3 style="font-size:15px; margin-bottom:10px;">Weitere Maßnahme hinzufügen</h3>
      <div class="form-row">
        <div class="form-field"><label for="customMeasureText">Maßnahme</label><input id="customMeasureText" type="text" placeholder="z. B. Physiotherapie zweimal wöchentlich"></div>
        <button class="btn" id="addCustomMeasureBtn">Hinzufügen</button>
      </div>
    </div>`;
  if(state.customMeasures.length){
    html += `<div class="list-wrap">` + state.customMeasures.map(m=>`
      <div class="list-card">
        <div class="title">${m.text}</div>
        <button class="remove-btn" data-id="${m.id}" data-remove-custom="1">Entfernen</button>
      </div>`).join('') + `</div>`;
  }

  area.innerHTML = html;

  area.querySelectorAll('[data-remove-measure]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.excludedMeasures[btn.dataset.removeMeasure] = true;
      renderMassnahmenView();
    });
  });
  area.querySelectorAll('[data-reset-risk]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rid = btn.dataset.resetRisk;
      Object.keys(state.excludedMeasures).forEach(key=>{ if(key.startsWith(rid+'::')) delete state.excludedMeasures[key]; });
      renderMassnahmenView();
    });
  });
  const addBtn = document.getElementById('addCustomMeasureBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const text = document.getElementById('customMeasureText').value.trim();
    if(!text) return;
    state.customMeasures.push({id:nextId('cm'), text});
    renderMassnahmenView();
  });
  area.querySelectorAll('[data-remove-custom]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.customMeasures = state.customMeasures.filter(m=>m.id!==btn.dataset.id);
      renderMassnahmenView();
    });
  });
}

function allMeasureLines(){
  const lines = [];
  activeRisks().forEach(r=>{
    r.measures.forEach((m,i)=>{
      if(!state.excludedMeasures[r.id+'::'+i]) lines.push(`- [${r.label}] ${m}`);
    });
  });
  state.customMeasures.forEach(m=> lines.push(`- ${m.text}`));
  return lines;
}

// --- SIS (Bearbeitungsansicht) ---
function renderSisCenter(){
  const field = SIS_FIELDS.find(f=>f.id===state.currentField);
  const area = document.getElementById('centerArea');
  if(field.isFreitext){
    area.innerHTML = `<h2>${field.name}</h2>
      <div class="sub">Freitextfeld – kein Bezug zum Begutachtungsinstrument. Hier notieren Sie in eigenen Worten, was der Person wichtig ist: Gewohnheiten, Vorlieben, Biografisches, Kommunikationshinweise, Tagesrhythmus. Direkt rechts eintragen.</div>`;
    return;
  }
  let html = `<h2>${field.num}. ${field.name}</h2>
    <div class="sub">Quellkriterien aus dem Begutachtungsinstrument, die in dieses Themenfeld einfließen. Antworten hier ändern Sie im Tab „Begutachtungsinstrument".</div>`;
  const byModule = {};
  field.source.forEach(cid=>{
    const q = CRITERIA[cid];
    if(!byModule[q.moduleName]) byModule[q.moduleName] = [];
    byModule[q.moduleName].push(q);
  });
  Object.keys(byModule).forEach(modName=>{
    html += `<div class="source-group"><h4>Aus NBA – ${modName}</h4>`;
    byModule[modName].forEach(q=>{
      const ans = state.answers[q.id];
      const chipCls = ans==='ja' ? 'ja' : (ans==='nein' ? 'nein' : 'leer');
      const chipText = ans==='ja' ? 'Ja' : (ans==='nein' ? 'Nein' : 'offen');
      html += `<div class="source-item"><span>${q.id} – ${q.crit}</span><span class="status-chip ${chipCls}">${chipText}</span></div>`;
    });
    html += `</div>`;
  });
  const fieldRisks = RISKS.filter(r=>r.fieldId===field.id);
  if(fieldRisks.length){
    html += `<div class="source-group"><h4>Risikoeinschätzung</h4>`;
    fieldRisks.forEach(r=>{
      const effAns = effectiveRiskAnswer(r);
      const auto = isAutoDetected(r);
      const reasons = matchedReasons(r);
      html += `
        <div class="question-row">
          <div class="qtext">
            <span class="qcrit">${r.label}${auto ? ' <span class="status-chip ja" style="margin-left:6px;">automatisch erkannt</span>' : ''}</span>
            <p class="qexpl">${r.question}</p>
            ${auto && reasons.length ? `<p class="qexpl" style="color:var(--muted); font-size:12.5px; margin-top:4px;">Grund (aus Begutachtungsinstrument): ${reasons.join(', ')}</p>` : ''}
          </div>
          <div class="toggle risk-toggle" data-risk="${r.id}">
            <button class="on-ja ${effAns==='ja'?'selected':''}" data-val="ja">Ja</button>
            <button class="on-nein ${effAns==='nein'?'selected':''}" data-val="nein">Nein</button>
          </div>
        </div>`;
    });
    html += `<div class="info-box" style="margin-top:12px;">Risiken werden automatisch aus den Antworten im Tab „Begutachtungsinstrument" erkannt und hier sowie im SIS-Text vorausgefüllt. Mit „Nein" können Sie eine automatische Erkennung gezielt übersteuern.</div>`;
    html += `</div>`;
  }
  area.innerHTML = html;
  area.querySelectorAll('.toggle[data-risk] button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rid = btn.parentElement.dataset.risk;
      const val = btn.dataset.val;
      state.risks[rid] = (state.risks[rid]===val) ? null : val;
      renderAll();
    });
  });
}
function renderSisOutput(){
  const field = SIS_FIELDS.find(f=>f.id===state.currentField);
  const auto = computeFieldText(field);
  const text = state.overrides[field.id] !== undefined ? state.overrides[field.id] : auto;
  const out = document.getElementById('outputArea');
  const subLine = field.isFreitext
    ? 'Frei formulierter Text, direkt von der Pflegefachkraft bzw. der Person selbst.'
    : 'Automatisch erstellt aus den zugehörigen NBA-Antworten. Frei editierbar.';
  out.innerHTML = `
    <h3>SIS-Text – ${field.name}</h3>
    <div class="sub">${subLine}</div>
    <textarea id="fieldText" placeholder="${field.isFreitext ? 'Noch nichts eingetragen.' : 'Noch keine zugehörigen Kriterien beantwortet.'}">${text}</textarea>
    <div class="out-actions">
      ${field.isFreitext ? '' : '<button class="btn secondary" id="resetFieldBtn">Neu generieren</button>'}
      <button class="btn secondary" id="copyFieldBtn">Text kopieren</button>
    </div>
    <div class="note">Der generierte Text ersetzt nicht die fachliche Einschätzung der Pflegefachkraft. Bitte vor Übernahme prüfen und bei Bedarf anpassen.</div>
  `;
  document.getElementById('fieldText').addEventListener('input', (e)=>{ state.overrides[field.id] = e.target.value; });
  const resetBtn = document.getElementById('resetFieldBtn');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{ delete state.overrides[field.id]; renderSisOutput(); });
  document.getElementById('copyFieldBtn').addEventListener('click', ()=>{ navigator.clipboard.writeText(document.getElementById('fieldText').value); });
}

function getPatientData(){
  return {
    vorname: document.getElementById('pvorname').value || '—',
    aufnahmedatum: document.getElementById('pdate').value || '—',
    pflegegrad: document.getElementById('ppflegegrad').value || 'noch nicht beantragt',
  };
}

// --- SIS lesen (finales Dokument) ---
function renderLesenView(){
  const p = getPatientData();
  const area = document.getElementById('centerArea');

  let diagHtml = state.diagnoses.length
    ? `<ul>${[...state.diagnoses].sort((a,b)=>(b.wichtig?1:0)-(a.wichtig?1:0)).map(d=>`<li>${d.wichtig?`<strong>${d.text}</strong> <span class="status-chip ja">wichtig</span>`:d.text}${d.icd?` (ICD-10: ${d.icd})`:''}</li>`).join('')}</ul>`
    : `<p class="field-text" style="color:var(--muted);">Keine Diagnosen erfasst.</p>`;

  let fieldsHtml = SIS_FIELDS.map(field=>{
    const heading = `<h3>${field.num ? field.num+'. ' : ''}${field.name}</h3>`;
    if(state.overrides[field.id] !== undefined){
      // Manuell bearbeiteter Text: wird als freier Text angezeigt, ohne automatische Risiko-Formatierung.
      return heading + `<p class="field-text">${state.overrides[field.id] || '(keine Angaben)'}</p>`;
    }
    const narrative = computeFieldCriteriaText(field);
    let body = narrative ? `<p class="field-text">${narrative}</p>` : '';
    const fieldRisks = RISKS.filter(r=>r.fieldId===field.id);
    fieldRisks.forEach(r=>{
      const eff = effectiveRiskAnswer(r);
      if(eff==='ja'){
        const reasons = matchedReasons(r);
        body += `<p class="field-text"><strong class="risk-present">${pickVariant(r.statement, r.id+'::ja')}</strong>${reasons.length ? ` <span style="color:var(--muted); font-weight:400;">Grund: ${reasons.join(', ')}.</span>` : ''}</p>`;
      } else if(eff==='nein'){
        body += `<p class="field-text"><strong class="risk-absent">${pickVariant(r.negStatement, r.id+'::nein')}</strong></p>`;
      }
    });
    if(!body) body = `<p class="field-text" style="color:var(--muted);">(keine Angaben)</p>`;
    return heading + body;
  }).join('');

  const measureLines = allMeasureLines();
  const massnahmenHtml = measureLines.length
    ? `<ul>${measureLines.map(l=>`<li>${l.replace(/^- /,'')}</li>`).join('')}</ul>`
    : `<p class="field-text" style="color:var(--muted);">Keine Maßnahmen erfasst.</p>`;

  area.innerHTML = `
    <div class="doc-actions">
      <button class="btn secondary" id="copyAllBtn">Gesamte SIS kopieren</button>
      <button class="btn" id="downloadBtn">SIS exportieren (.txt)</button>
    </div>
    <div class="doc-sheet">
      <h2>Strukturierte Informationssammlung (SIS)</h2>
      <div class="doc-meta">
        ${p.vorname}<br>
        Datum der Aufnahme: ${p.aufnahmedatum} &nbsp;·&nbsp; Pflegegrad: ${p.pflegegrad}
      </div>
      <h3>Diagnosen</h3>
      ${diagHtml}
      ${fieldsHtml}
      <h3>Maßnahmenplan</h3>
      ${massnahmenHtml}
      <h3>Nachweis</h3>
      <div class="form-row">
        <div class="form-field"><label for="metaErsteller">Erstellt von (Pflegefachkraft)</label><input id="metaErsteller" type="text" placeholder="Vorname Nachname" value="${state.meta.ersteller}"></div>
        <div class="form-field" style="flex:0 0 160px;"><label for="metaDatum">Datum der Erstellung</label><input id="metaDatum" type="date" value="${state.meta.erstelltAm}"></div>
      </div>
    </div>
  `;
  document.getElementById('metaErsteller').addEventListener('input', (e)=>{ state.meta.ersteller = e.target.value; });
  document.getElementById('metaDatum').addEventListener('input', (e)=>{ state.meta.erstelltAm = e.target.value; });
  document.getElementById('copyAllBtn').addEventListener('click', ()=> navigator.clipboard.writeText(fullDocumentText()));
  document.getElementById('downloadBtn').addEventListener('click', ()=>{
    const blob = new Blob([fullDocumentText()], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'SIS.txt'; a.click();
    URL.revokeObjectURL(url);
  });
}

function fullDocumentText(){
  const p = getPatientData();
  let doc = `Strukturierte Informationssammlung (SIS)\n`;
  doc += `Vorname: ${p.vorname}\nDatum der Aufnahme: ${p.aufnahmedatum}\nPflegegrad: ${p.pflegegrad}\n\n`;
  doc += `Diagnosen\n`;
  doc += state.diagnoses.length ? [...state.diagnoses].sort((a,b)=>(b.wichtig?1:0)-(a.wichtig?1:0)).map(d=>`- ${d.wichtig?'[WICHTIG] ':''}${d.text}${d.icd?` (ICD-10: ${d.icd})`:''}`).join('\n') : '(keine erfasst)';
  doc += `\n\n`;
  SIS_FIELDS.forEach(field=>{
    const auto = computeFieldText(field);
    const text = state.overrides[field.id] !== undefined ? state.overrides[field.id] : auto;
    doc += `${field.num ? field.num+'. ' : ''}${field.name}\n${text || '(keine Angaben)'}\n\n`;
  });
  doc += `Maßnahmenplan\n`;
  const measureLines = allMeasureLines();
  doc += measureLines.length ? measureLines.join('\n') : '(keine Maßnahmen erfasst)';
  doc += `\n\n`;
  doc += `Nachweis\nErstellt von: ${state.meta.ersteller || '—'}\nDatum der Erstellung: ${state.meta.erstelltAm || '—'}\n`;
  return doc;
}

function renderAll(){
  if(state.view==='begutachtung'){
    renderSideNav(); renderBegutachtungCenter(); renderBegutachtungOutput();
  } else if(state.view==='sis'){
    renderSideNav(); renderSisCenter(); renderSisOutput();
  } else if(state.view==='diagnose'){
    document.getElementById('progressGlobal').textContent = '';
    renderDiagnoseView();
  } else if(state.view==='massnahmen'){
    document.getElementById('progressGlobal').textContent = '';
    renderMassnahmenView();
  } else if(state.view==='lesen'){
    document.getElementById('progressGlobal').textContent = '';
    renderLesenView();
  }
}

['pvorname','pdate','ppflegegrad'].forEach(id=>{
  const refresh = ()=>{
    if(state.view==='lesen') renderLesenView();
    if(state.view==='sis' && (id==='pvorname'||id==='pdate'||id==='ppflegegrad')) renderSisOutput();
  };
  document.getElementById(id).addEventListener('input', refresh);
  document.getElementById(id).addEventListener('change', refresh);
});

renderTabs();
setView('begutachtung');
</script>
</body>
</html>
